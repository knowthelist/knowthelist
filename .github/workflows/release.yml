name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to update
        required: true
        type: string

permissions:
  contents: write

jobs:
  linux:
    name: Linux packages
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            cmake ninja-build pkg-config \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools \
            libfreetype6-dev libfontconfig1-dev libegl1-mesa-dev libxkbcommon-dev \
            libgl1-mesa-dev libx11-dev libxext-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxcomposite-dev libx11-xcb-dev \
            libtag1-dev libasound2-dev libcurl4-openssl-dev \
            libfreetype-dev libfontconfig-dev \
            rpm

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build --parallel 2

      - name: Package DEB and RPM
        run: |
          cpack --config build/CPackConfig.cmake -G DEB
          cpack --config build/CPackConfig.cmake -G RPM
          mkdir -p release-assets
          mv ./*.deb ./*.rpm release-assets/

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: release-assets/*

  macos:
    name: macOS application
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: brew install qt taglib

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"

      - name: Build
        run: cmake --build build --parallel 2

      - name: Bundle application dependencies
        run: |
          APP="build/knowthelist.app"
          "$(brew --prefix qt)/bin/macdeployqt" "$APP"
          mkdir -p "$APP/Contents/Frameworks"
          TAGLIB_LIB="$(otool -L "$APP/Contents/MacOS/knowthelist" | awk '/libtag/ {print $1; exit}')"
          if [ -n "$TAGLIB_LIB" ] && [ -f "$TAGLIB_LIB" ]; then
            cp "$TAGLIB_LIB" "$APP/Contents/Frameworks/"
            install_name_tool -change "$TAGLIB_LIB" \
              "@loader_path/../Frameworks/$(basename "$TAGLIB_LIB")" \
              "$APP/Contents/MacOS/knowthelist"
          fi
          VERSION="${{ inputs.tag || github.ref_name }}"
          ditto -c -k --sequesterRsrc --keepParent "$APP" \
            "knowthelist-${VERSION}-macOS.zip"

      - name: Upload macOS bundle
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundle
          path: knowthelist-*.zip

  windows:
    name: Windows application
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qttools
          cache: true

      - name: Install TagLib
        shell: pwsh
        run: vcpkg install taglib:x64-windows

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Bundle application dependencies
        shell: pwsh
        run: |
          $version = "${{ inputs.tag || github.ref_name }}"
          $version = $version.TrimStart("v")
          $bundle = "knowthelist-$version-Windows"
          $exe = "build/Release/knowthelist.exe"

          New-Item -ItemType Directory -Path $bundle | Out-Null
          Copy-Item $exe $bundle
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" `
            --release `
            --no-translations `
            "$bundle/knowthelist.exe"

          Copy-Item `
            "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/tag.dll" `
            $bundle
          Compress-Archive -Path "$bundle/*" -DestinationPath "$bundle.zip"

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: knowthelist-*-Windows.zip

  release:
    name: Publish GitHub release
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: release-assets

      - name: Download macOS bundle
        uses: actions/download-artifact@v4
        with:
          name: macos-bundle
          path: release-assets

      - name: Download Windows bundle
        uses: actions/download-artifact@v4
        with:
          name: windows-bundle
          path: release-assets

      - name: Create source archives
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          git archive --format=zip --prefix="knowthelist-${VERSION}/" \
            -o "release-assets/knowthelist-${VERSION}-source.zip" HEAD
          git archive --format=tar.gz --prefix="knowthelist-${VERSION}/" \
            -o "release-assets/knowthelist-${VERSION}-source.tar.gz" HEAD

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "Knowthelist ${TAG#v}" \
              --generate-notes
          fi
